# The tests, on every push and PR.
#
# This repo had none, so "the tests pass" was not something anyone could check.
# It exists now because the web-kit storage retrofit needs a check that BITES:
# tests/retrofit-web-kit.test.js boots the real page and asserts what is actually
# in localStorage, which is 3/10 on the page before the retrofit and 10/10 after.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: The retrofit is real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      # Node 20 is already on ubuntu-latest; no setup-node action to pin.
      - name: happy-dom (the only dependency, and only for the test)
        run: npm i --no-save happy-dom
      - name: Boot the real page and check the store
        run: node tests/retrofit-web-kit.test.js docs/play/index.html
