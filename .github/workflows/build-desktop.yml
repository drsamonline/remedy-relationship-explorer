name: Build desktop apps (Tauri)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ''
          - os: macos-latest
            target: ''
          - os: ubuntu-22.04
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Prepare web asset
        working-directory: desktop
        run: |
          npm install
          mkdir -p web && cp ../docs/play/index.html web/index.html
      - name: Generate icons
        working-directory: desktop
        run: npx tauri icon ../assets/icon.svg || npx tauri icon ../assets/icon.png
      - name: Build
        working-directory: desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: ignore
