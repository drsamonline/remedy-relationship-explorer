<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Remedy Relationship Explorer</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0e0f12">
<link rel="icon" href="/remedy-relationship-explorer/assets/icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0e0f12;--panel:#181a20;--ink:#f2efe9;--dim:#a5a49c;--line:#2a2d36;--line2:#343843;
    --copper:#e79b5c;--copper2:#f3b57e;--mint:#84d3bf;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    background:radial-gradient(900px 480px at 50% -10%,rgba(231,155,92,.16),transparent 68%),var(--bg);
    color:var(--ink);font:16px/1.62 var(--sans);-webkit-font-smoothing:antialiased}
  .card{max-width:560px;width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:46px 34px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .mark{width:54px;height:54px;color:var(--copper);margin:0 auto 18px;display:block}
  .code{font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--copper);text-transform:uppercase}
  h1{font-size:clamp(24px,4.6vw,34px);margin:12px 0 12px;letter-spacing:-.02em}
  p{color:var(--dim);margin:0 0 26px}
  .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:12px;font-weight:650;
    font-size:15px;border:1px solid var(--line2);background:#1f222b;color:var(--ink);text-decoration:none}
  .btn:hover{background:#262a34}
  .btn.primary{background:linear-gradient(135deg,var(--copper),var(--copper2));border-color:transparent;color:#1a1108}
  .btn.primary:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="4.6" fill="currentColor"/>
      <circle cx="16" cy="4" r="2.8" fill="currentColor" opacity=".85"/>
      <circle cx="27.4" cy="22.4" r="2.8" fill="currentColor" opacity=".85"/>
      <circle cx="4.6" cy="22.4" r="2.8" fill="currentColor" opacity=".85"/>
      <g stroke="currentColor" stroke-width="1.4" opacity=".7">
        <line x1="16" y1="16" x2="16" y2="4"/><line x1="16" y1="16" x2="27.4" y2="22.4"/>
        <line x1="16" y1="16" x2="4.6" y2="22.4"/>
      </g>
    </svg>
    <div class="code">Error 404</div>
    <h1>That page isn&rsquo;t in the graph</h1>
    <p>The page you asked for doesn&rsquo;t exist here. Head back to the landing page, or open the explorer itself.</p>
    <div class="cta">
      <a class="btn primary" href="/remedy-relationship-explorer/play/">Open the live demo</a>
      <a class="btn" href="/remedy-relationship-explorer/">Back to the landing page</a>
    </div>
  </main>
</body>
</html>
